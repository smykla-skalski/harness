# The panel ships on its own cadence, so `scripts/version.sh` lists it as an
# independent package and leaves the version below alone. The workspace number
# was only ever the one it happened to be created under; this is its own line,
# and sitting far below the workspace version is deliberate rather than stale.
#
# Keep `name` and `version` adjacent: the version script reads them with one
# regex that allows only whitespace between the two.
[package]
name = "harness-panel"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "harness-panel"
path = "src/main.rs"
test = false

[dependencies]
axum = { version = "0.8.9", features = ["http2", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.0"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
futures-util = "0.3.31"
getrandom = "0.4.3"
hex = "0.4.3"
include_dir = "0.7.4"
libc = "0.2"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "form", "http2", "json", "rustls-no-provider"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "sqlite-bundled", "runtime-tokio", "tls-rustls-ring", "migrate", "macros"] }
thiserror = "2.0.19"
# `axum-extra`'s cookie builder takes durations from `time`, not `std`.
time = "0.3.54"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
# The daemon socket is TLS-pinned the same way the HTTP calls are, and reqwest
# will not hand out a raw stream to run a websocket over, so the panel drives
# this handshake itself. `ring` rather than the default backend, matching the
# provider the rest of the panel installs.
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
x509-parser = "=0.18.1"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
# Generating a certificate is the only way to exercise the pin verifier,
# which is the control the whole panel-to-daemon coupling rests on.
rcgen = { version = "=0.14.8", default-features = false, features = ["pem", "ring", "x509-parser"] }
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
