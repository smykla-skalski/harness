[package]
name = "harness-session"
version = "55.0.1"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-agents = { path = "../harness-agents", version = "55.0.1" }
harness-daemon-client = { path = "../harness-daemon-client", version = "55.0.1" }
harness-infra = { path = "../harness-infra", version = "55.0.1" }
harness-kernel = { path = "../harness-kernel", version = "55.0.1" }
# Only `types`, `classifier`, and `application::maintenance` (storage) are
# reached from here; the `cli`-gated request/execute/render surface is not,
# so this stays default-features = false the same way harness-daemon's own
# dependency on harness-observe does.
harness-observe = { path = "../harness-observe", version = "55.0.1", default-features = false }
harness-protocol = { path = "../harness-protocol", version = "55.0.1" }
harness-workspace = { path = "../harness-workspace", version = "55.0.1" }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
fs-err = "3.3.0"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
similar = "3.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
utoipa = "5.5.0"

[features]
# Mirrors the root crate's own `daemon-runtime` feature, which this crate's
# `service` module read directly before the move: the root crate's binary
# still compiles `service`'s test module into a `daemon-runtime` build even
# outside `cargo test`, and this keeps that compiled shape unchanged now that
# `service` lives here instead.
daemon-runtime = []

[dev-dependencies]
harness-testkit = { path = "../../testkit" }
temp-env = { version = "=0.3.6", features = ["async_closure"] }
tempfile = "3.27.0"

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel, harness-workspace,
# harness-infra, and harness-agents do: a crate extracted from src/ keeps
# the rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
