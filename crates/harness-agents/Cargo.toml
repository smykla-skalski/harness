[package]
name = "harness-agents"
version = "55.0.2"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# `acp` needs its own copy of the ACP client/subprocess-supervision
# dependencies: `harness-hook` depends on this crate for `storage`/`runtime`
# alone and has no reason to build them. `harness-daemon` and `harness-bridge`
# request this explicitly; the root crate forwards its own `bridge-runtime`
# feature onto it the same way.
bridge-runtime = ["dep:agent-client-protocol", "dep:nix", "dep:portable-pty", "dep:tokio"]
# Exposes acp's probe-cache test seams (normally `cfg(test)`-only) to the root
# crate's own tests, which depend on this crate as an ordinary library and so
# never see its `cfg(test)` items. Matches `harness-daemon-client`'s
# `test-support` feature.
test-support = ["bridge-runtime"]

[dependencies]
async-trait = "0.1.83"
harness-infra = { path = "../harness-infra", version = "55.0.2" }
harness-kernel = { path = "../harness-kernel", version = "55.0.2" }
harness-protocol = { path = "../harness-protocol", version = "55.0.2" }
harness-workspace = { path = "../harness-workspace", version = "55.0.2" }
agent-client-protocol = { version = "=2.0.0", optional = true }
chrono = { version = "0.4.44", features = ["serde"] }
fs-err = "3.3.0"
nix = { version = "0.31", features = ["signal"], optional = true }
portable-pty = { version = "0.9.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "test-util", "time"], optional = true }
tracing = "0.1.44"
walkdir = "2.5.0"

[dev-dependencies]
harness-testkit = { path = "../../testkit" }
temp-env = { version = "=0.3.6", features = ["async_closure"] }
tempfile = "3.27.0"

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel, harness-workspace, and
# harness-infra do: a crate extracted from src/ keeps the rules its sources
# were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
