[package]
name = "harness-task-board"
version = "54.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# Exposes items normally `cfg(test)`-only (the legacy file-backed
# `TaskBoardStore`/`MachineRegistry` test doubles, and the policy-graph
# synchronous gate cache's test hooks) to the root crate's and
# `harness-daemon`'s own tests, which depend on this crate as an ordinary
# library and so never see its `cfg(test)` items. Matches `harness-agents`'s
# and `harness-daemon-client`'s own `test-support` feature.
test-support = []
# Compiles the policy-graph decision-recording pieces the daemon binary needs
# (sink installers, the canvas-workspace schema version) plus the whole
# `policy_runtime` module (the workflow-run store, scheduler, event inbox, and
# handoff/notification/task-creation outboxes) without pulling either into a
# plain library build. The root crate activates this alongside its own
# `daemon-runtime` feature, and `harness-daemon` forwards its own feature of
# the same name onto it.
daemon-runtime = []

[dependencies]
async-trait = "0.1.83"
harness-github-api = { path = "../harness-github-api", version = "54.0.0" }
harness-infra = { path = "../harness-infra", version = "54.0.0" }
harness-kernel = { path = "../harness-kernel", version = "54.0.0" }
harness-protocol = { path = "../harness-protocol", version = "54.0.0" }
harness-workspace = { path = "../harness-workspace", version = "54.0.0" }
arc-swap = "1.9.1"
base64 = "0.23.0"
caseless = "0.2.2"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.0", features = ["derive"] }
fs-err = "3.3.0"
gix = { version = "0.86.0", features = [
  "progress-tree",
  "status",
  "worktree-mutation",
  "index",
  "blocking-http-transport-reqwest-rust-tls",
] }
hex = "0.4.3"
libc = "0.2"
rayon = "1.11.0"
regex = "1.11.1"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yml = "0.0.13"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["fs", "macros", "rt", "sync"] }
tracing = "0.1.44"
utoipa = "5.5.0"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
harness-github-api = { path = "../harness-github-api", version = "54.0.0", features = ["test-support"] }
# Unconditional, unlike root's optional `dep:nix` under `bridge-runtime`: the
# only user is this crate's own `#[cfg(unix)]` github test-support helper,
# with no unrelated feature to piggyback on for gating the dependency itself.
nix = { version = "0.31", features = ["fs"] }
tempfile = "3.27.0"
temp-env = "=0.3.6"

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel, harness-workspace,
# harness-infra, and harness-agents do: a crate extracted from src/ keeps the
# rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
