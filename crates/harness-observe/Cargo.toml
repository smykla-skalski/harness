[package]
name = "harness-observe"
version = "54.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = ["cli"]
# CLI argument shapes (`transport`) and output rendering (`output`,
# `scan::render`, `dump::format`) plus everything that only exists to feed
# them (`application::execute`, `application::request`, the non-storage
# `application::maintenance` submodules, `compare`, `context_cmd`, `dump`,
# `scan`, `watch`). None of it is reachable from `application::maintenance`'s
# storage functions, `classifier`, or `types`, which is what a daemon-only
# build actually needs.
cli = ["dep:chrono", "dep:clap", "dep:notify", "dep:serde-sarif", "dep:serde_yml", "dep:tokio"]
# Forwarded from the root crate so `types::presets`'s cfg-gated `FocusPreset`
# stays gated the same way once it compiles here instead of in `src/observe`.
standalone-daemon = []

[dependencies]
chrono = { version = "0.4.44", features = ["serde"], optional = true }
clap = { version = "4.6.0", features = ["derive"], optional = true }
fs-err = "3.3.0"
harness-agents = { path = "../harness-agents", version = "54.0.0" }
harness-infra = { path = "../harness-infra", version = "54.0.0" }
harness-kernel = { path = "../harness-kernel", version = "54.0.0" }
harness-protocol = { path = "../harness-protocol", version = "54.0.0" }
harness-workspace = { path = "../harness-workspace", version = "54.0.0" }
hex = "0.4.3"
notify = { version = "8.2.0", optional = true }
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde-sarif = { version = "0.8.0", optional = true }
serde_json = "1.0.149"
serde_yml = { version = "0.0.13", optional = true }
sha2 = "0.11.0"
tokio = { version = "1.50.0", features = ["macros", "sync", "time"], optional = true }
walkdir = "2.5.0"

[dev-dependencies]
temp-env = "=0.3.6"
tempfile = "3.27.0"

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel and harness-workspace do: a
# crate extracted from src/ keeps the rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
