[package]
name = "harness-observe"
version = "54.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-kernel = { path = "../harness-kernel", version = "54.0.0" }
harness-protocol = { path = "../harness-protocol", version = "54.0.0" }
hex = "0.4.3"
regex = "1.11.1"
serde_json = "1.0.149"
sha2 = "0.11.0"

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel and harness-workspace do: a
# crate extracted from src/ keeps the rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
