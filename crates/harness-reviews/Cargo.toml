[package]
name = "harness-reviews"
version = "55.0.2"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-github-api = { path = "../harness-github-api", version = "55.0.2" }
harness-kernel = { path = "../harness-kernel", version = "55.0.2" }
harness-protocol = { path = "../harness-protocol", version = "55.0.2" }
harness-task-board = { path = "../harness-task-board", version = "55.0.2" }
harness-workspace = { path = "../harness-workspace", version = "55.0.2" }
async-trait = "0.1.83"
base64 = "0.23.0"
chrono = { version = "0.4.44", features = ["serde"] }
gix = { version = "0.86.0", features = [
    "progress-tree",
    "status",
    "worktree-mutation",
    "index",
    "blocking-http-transport-reqwest-rust-tls",
] }
regex = "1.11.1"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tracing = "0.1.44"
utoipa = "5.5.0"

[dev-dependencies]
axum = { version = "=0.8.9", features = ["http2", "json", "ws"] }
harness-github-api = { path = "../harness-github-api", version = "55.0.2", features = ["test-support"] }
harness-task-board = { path = "../harness-task-board", version = "55.0.2", features = ["test-support"] }
tempfile = "=3.27.0"

[features]
# Gates the REST patch fetcher (`files::patch_rest::fetch_patches`) and the
# whole `policy` module (the PR merge-policy action executor/provider and
# its task-board policy-graph/policy-runtime wiring), neither of which
# anything but the daemon binary calls; matches the root crate's own
# feature of the same name, forwarded from there for the same reason.
daemon-runtime = ["harness-task-board/daemon-runtime"]
# Exposes `policy::authored_reviews_policy_plan` (normally `cfg(test)`-only)
# to the root crate's own tests, which depend on this crate as an ordinary
# library and so never see its `cfg(test)` items. Matches
# `harness-task-board`'s and `harness-github-api`'s own `test-support`
# feature. Forwards to `harness-task-board`'s own feature of the same name
# because `authored_reviews_policy_plan` reaches its `cfg(test)`-only
# `cached_gate_policy` re-export too.
test-support = ["harness-task-board/test-support"]

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel, harness-workspace,
# harness-infra, harness-agents, and harness-github-api do: a crate extracted
# from src/ keeps the rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
