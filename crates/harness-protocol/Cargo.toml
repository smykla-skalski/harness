[package]
name = "harness-protocol"
version = "55.0.3"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
base64 = "0.23.0"
clap = { version = "4.6.0", features = ["derive"] }
harness-kernel = { path = "../harness-kernel", version = "55.0.3" }
chrono = { version = "0.4.44", features = ["serde"] }
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
utoipa = "5.5.0"

[dev-dependencies]
temp-env = "=0.3.6"

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
