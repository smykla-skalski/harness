[package]
name = "harness-bridge"
version = "55.0.3"
edition = "2024"
rust-version = "1.95"

[lib]
test = false

[[bin]]
name = "harness-bridge"
path = "src/main.rs"
test = false

[dependencies]
agent-client-protocol = "=2.0.0"
async-trait = "0.1.83"
base64 = "0.23.0"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
crossterm = "0.29.0"
fs2 = "0.4.3"
fs-err = "3.3.0"
harness-agents = { path = "../harness-agents", version = "55.0.3", features = ["bridge-runtime"] }
# Optional and gated behind `daemon-runtime`, never this crate's own default
# (`bridge-runtime`) feature set: only `agent_acp`, `agent_tui`, and `bridge`
# swap from the `#[path]`-mirrored tree to the real crate (see
# `src/daemon/mod.rs`). Default features stay on rather than
# `default-features = false` because those are the same
# `daemon-runtime`/`standalone-daemon`/`standalone-worker` trio the real
# `harness-daemon` binary itself always builds with, matching root's own
# `harness-daemon` dependency.
harness-daemon = { path = "../harness-daemon", version = "55.0.3", optional = true }
harness-daemon-client = { path = "../harness-daemon-client", version = "55.0.3" }
harness-daemon-discovery = { path = "../harness-daemon-discovery", version = "55.0.3" }
harness-daemon-root = { path = "../harness-daemon-root", version = "55.0.3" }
# Optional: only the `daemon-runtime` build mode needs the task-board runtime
# config surface (e.g. `agent_acp`'s OpenRouter token lookup); the default
# `bridge-runtime` build has no reason to depend on `harness-task-board`.
harness-daemon-state = { path = "../harness-daemon-state", version = "55.0.3", optional = true }
harness-hook = { path = "../harness-hook", version = "55.0.3" }
harness-infra = { path = "../harness-infra", version = "55.0.3" }
harness-kernel = { path = "../harness-kernel", version = "55.0.3" }
harness-workspace = { path = "../harness-workspace", version = "55.0.3" }
harness-protocol = { path = "../harness-protocol", version = "55.0.3" }
harness-telemetry = { path = "../harness-telemetry", version = "55.0.3" }
hex = "0.4.3"
nix = { version = "0.31", features = ["signal"] }
notify = "8.2.0"
portable-pty = "0.9.0"
regex = "1.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
signal-hook = "0.4"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "time", "process", "io-std", "io-util", "sync", "macros", "net"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tracing = "0.1.44"
user_dirs = "0.2.0"
utoipa = "5.5.0"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
uzers = { version = "0.12.2", default-features = false }
vt100 = "0.16.2"

[dev-dependencies]
temp-env = { version = "=0.3.6", features = ["async_closure"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[features]
default = ["bridge-runtime"]
bridge-runtime = []
# `agent_acp`, `agent_tui`, and `bridge` swap to a thin re-export over the
# real `harness-daemon` crate under this feature (see `src/daemon/mod.rs`):
# their daemon-only branches assume sibling modules (`service`, `db`,
# `codex_controller`, `session::service`) this crate never carries on its
# own, so nothing but the real dependency can satisfy them. `state` needs no
# such swap; it already gets its daemon-only surface from `harness-daemon-state`.
daemon-runtime = ["dep:harness-daemon-state", "dep:harness-daemon"]

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
