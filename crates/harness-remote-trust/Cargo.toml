[package]
name = "harness-remote-trust"
version = "55.0.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
base64 = "0.23.0"
harness-protocol = { path = "../harness-protocol", version = "55.0.0" }
hex = "0.4.3"
http = "1.4.2"
rand_core06 = { package = "rand_core", version = "0.6.4", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
utoipa = { version = "5.5.0", optional = true }

[features]
openapi = ["dep:utoipa"]
test-support = []

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
unexpected_cfgs = { level = "deny", priority = 2, check-cfg = ['cfg(feature, values("openapi", "test-support"))'] }
