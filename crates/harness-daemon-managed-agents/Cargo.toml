[package]
name = "harness-daemon-managed-agents"
version = "57.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-agents = { path = "../harness-agents", version = "57.0.0" }
harness-daemon-db-queries = { path = "../harness-daemon-db-queries", version = "57.0.0" }
harness-hook = { path = "../harness-hook", version = "57.0.0" }
harness-kernel = { path = "../harness-kernel", version = "57.0.0" }
harness-protocol = { path = "../harness-protocol", version = "57.0.0" }
harness-task-board = { path = "../harness-task-board", version = "57.0.0" }
harness-workspace = { path = "../harness-workspace", version = "57.0.0" }
fs-err = "3.3.0"
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["sync"] }
tracing = "0.1.44"
vt100 = "0.16.2"

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
