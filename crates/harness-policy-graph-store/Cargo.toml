[package]
name = "harness-policy-graph-store"
version = "57.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
harness-kernel = { path = "../harness-kernel", version = "57.0.0" }
harness-task-board = { path = "../harness-task-board", version = "57.0.0" }
harness-workspace = { path = "../harness-workspace", version = "57.0.0" }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls-ring", "macros", "chrono", "uuid", "json"] }
tracing = "0.1.44"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[features]
# Exposes the `PolicyCanvasDraftSaveResult` fields and helpers normally
# `cfg(test)`-only to `harness-daemon`'s own tests, which depend on this
# crate as an ordinary library and so never see its `cfg(test)` items.
# Matches `harness-task-board`'s and `harness-db-schema`'s own `test-support`
# feature.
test-support = []

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
