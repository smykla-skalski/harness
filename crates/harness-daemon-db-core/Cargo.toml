[package]
name = "harness-daemon-db-core"
version = "57.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# Exposes `set_schema_init_hook`, normally `cfg(test)`-only, to
# `harness-daemon`'s own `db/tests/` migration-repair suite, which depends on
# this crate as an ordinary library and so never sees its `cfg(test)` items.
# Mirrors `harness-db-schema`'s own `test-support` feature.
test-support = []

[dependencies]
harness-daemon-snapshot = { path = "../harness-daemon-snapshot", version = "57.0.0" }
harness-db-schema = { path = "../harness-db-schema", version = "57.0.0" }
harness-kernel = { path = "../harness-kernel", version = "57.0.0" }
harness-protocol = { path = "../harness-protocol", version = "57.0.0" }
harness-session = { path = "../harness-session", version = "57.0.0" }
harness-task-board = { path = "../harness-task-board", version = "57.0.0" }
harness-telemetry = { path = "../harness-telemetry", version = "57.0.0" }
hex = "0.4.3"
rusqlite = { version = "0.39", features = ["bundled"] }
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["sqlite", "sqlite-bundled", "runtime-tokio", "tls-rustls-ring", "migrate", "macros", "chrono", "uuid", "json"] }
tokio = { version = "=1.53.1", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry: this code was extracted from harness-daemon's own `db`
# module, which itself carries only the lighter set, so it keeps the bar it
# was already written and reviewed against instead of a stricter one applied
# after the fact.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
