[package]
name = "harness-daemon-remote-cli"
version = "55.0.3"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
async-trait = "0.1.83"
axum = "0.8.7"
clap = { version = "4.6.0", features = ["derive", "env"] }
harness-daemon = { path = "../harness-daemon", version = "55.0.3", features = ["daemon-runtime"] }
harness-kernel = { path = "../harness-kernel", version = "55.0.3" }
harness-remote-trust = { path = "../harness-remote-trust", version = "55.0.3" }
harness-reviews = { path = "../harness-reviews", version = "55.0.3" }
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1.44"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
base64 = "=0.23.0"
harness-daemon = { path = "../harness-daemon", version = "55.0.3", features = ["test-support"] }
harness-remote-trust = { path = "../harness-remote-trust", version = "55.0.3", features = ["test-support"] }
harness-testkit = { path = "../../testkit" }
rcgen = { version = "=0.14.8", default-features = false, features = ["pem", "ring", "x509-parser"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
