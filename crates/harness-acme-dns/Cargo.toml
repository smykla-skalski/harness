[package]
name = "harness-acme-dns"
version = "57.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
async-trait = "0.1.83"
base64 = "0.23.0"
chrono = { version = "0.4.44", features = ["serde"] }
futures-util = "0.3.31"
harness-kernel = { path = "../harness-kernel", version = "57.0.0" }
hex = "0.4.3"
hickory-resolver = "0.26.1"
hmac = "0.13.0"
http = "1.4.2"
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
tokio = { version = "1.50.0", features = ["macros", "process", "rt-multi-thread", "test-util", "time"] }

[dev-dependencies]
temp-env = { version = "=0.3.6", features = ["async_closure"] }

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
