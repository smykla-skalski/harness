[package]
name = "harness-daemon-snapshot"
version = "55.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-agents = { path = "../harness-agents", version = "55.0.0", features = ["bridge-runtime"] }
harness-hooks = { path = "../harness-hooks", version = "55.0.0" }
harness-kernel = { path = "../harness-kernel", version = "55.0.0" }
harness-observe = { path = "../harness-observe", version = "55.0.0", default-features = false }
harness-session = { path = "../harness-session", version = "55.0.0" }
serde_json = "1.0.149"
tokio = { version = "1.50.0", default-features = false, features = ["rt"] }

[dev-dependencies]
# `harness-daemon` is deliberately not a dev-dependency here even though its
# `DaemonDb` implements this crate's storage seam: `harness-daemon` already
# depends on this crate normally, so a dev-dependency back onto it would be a
# cycle Cargo resolves by compiling this crate twice (once as `harness-daemon`'s
# ordinary dependency, once for this crate's own test binary), producing two
# distinct instances of `SnapshotStorage` that `DaemonDb` only implements for
# one. The tests that need a real `DaemonDb` live in `harness-daemon`'s own
# `daemon::db::tests::snapshot_integration` instead, which has no such cycle.
harness-testkit = { path = "../../testkit" }
fs-err = "3.3.0"
serde = "1.0.228"
temp-env = { version = "=0.3.6", features = ["async_closure"] }
tempfile = "3.27.0"

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry: this code was extracted from harness-daemon's own `daemon`
# module, which itself carries only the lighter set, so it keeps the bar it
# was already written and reviewed against instead of a stricter one applied
# after the fact.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
