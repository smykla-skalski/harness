[package]
name = "harness-github-api"
version = "54.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# Lets other crates in the workspace drive this crate's global client state
# against a mock HTTP server in their own tests, the same way this crate's
# own tests do, without their whole build compiling under `cfg(test)`.
test-support = []

[dependencies]
harness-kernel = { path = "../harness-kernel", version = "54.0.0" }
harness-workspace = { path = "../harness-workspace", version = "54.0.0" }
chrono = "0.4.44"
fs-err = "3.3.0"
hex = "0.4.3"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
axum = { version = "=0.8.9", features = ["http2", "json", "ws"] }
tempfile = "=3.27.0"

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel and harness-workspace do: a
# crate extracted from src/ keeps the rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
