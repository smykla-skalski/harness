[package]
name = "harness-daemon-launchd"
version = "55.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
fs-err = "3.3.0"
harness-daemon-root = { path = "../harness-daemon-root", version = "55.0.0" }
harness-kernel = { path = "../harness-kernel", version = "55.0.0" }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.44"
utoipa = "5.5.0"
uzers = { version = "0.12.2", default-features = false }

[dev-dependencies]
temp-env = { version = "=0.3.6", features = ["async_closure"] }
tempfile = "3.27.0"

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
