[package]
name = "harness-run"
version = "55.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# Forwarded from the root crate so the test modules gated on it stay gated the
# same way once these sources compile here instead of there.
standalone-worker = []

[dependencies]
harness-infra = { path = "../harness-infra", version = "55.0.0" }
harness-kernel = { path = "../harness-kernel", version = "55.0.0" }
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
hex = "0.4.3"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"

[dev-dependencies]
harness-testkit = { path = "../../testkit" }
insta = "=1.48.0"
tempfile = "=3.27.0"

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel and harness-workspace do: a
# crate extracted from src/ keeps the rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
