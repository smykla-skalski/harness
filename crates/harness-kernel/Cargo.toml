[package]
name = "harness-kernel"
version = "53.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# Forwarded from the root crate so the test modules gated on it stay gated the
# same way once these sources compile here instead of there.
standalone-worker = []

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
fs-err = "3.3.0"
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
regex = "1.11.1"
shell-words = "1.1.0"
tempfile = "3.27.0"
thiserror = "2.0.18"

[dev-dependencies]
insta = "=1.48.0"

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry; this crate is the base every later extraction copies.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
