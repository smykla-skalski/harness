[package]
name = "harness-timeline"
version = "55.0.3"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-agents = { path = "../harness-agents", version = "55.0.3" }
harness-kernel = { path = "../harness-kernel", version = "55.0.3" }
harness-observe = { path = "../harness-observe", version = "55.0.3", default-features = false }
harness-protocol = { path = "../harness-protocol", version = "55.0.3" }
harness-session = { path = "../harness-session", version = "55.0.3" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
fs-err = "3.3.0"
harness-testkit = { path = "../../testkit" }
temp-env = { version = "=0.3.6", features = ["async_closure"] }
tempfile = "=3.27.0"

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel, harness-workspace,
# harness-infra, and harness-agents do: a crate extracted from src/ keeps
# the rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
