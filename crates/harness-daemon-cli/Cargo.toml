[package]
name = "harness-daemon-cli"
version = "55.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
clap = { version = "4.6.0", features = ["derive", "env"] }
harness-daemon = { path = "../harness-daemon", version = "55.0.0", features = ["daemon-runtime"] }
harness-daemon-snapshot = { path = "../harness-daemon-snapshot", version = "55.0.0" }
harness-kernel = { path = "../harness-kernel", version = "55.0.0" }
harness-protocol = { path = "../harness-protocol", version = "55.0.0" }
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "time", "process", "io-std", "io-util", "sync", "macros", "net", "tracing"] }
tracing = "0.1.44"

[dev-dependencies]
temp-env = "=0.3.6"

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
