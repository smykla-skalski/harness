[package]
name = "harness-daemon-provider-credentials"
version = "55.0.1"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
hex = "0.4.3"
sha1 = "0.11.0"
tracing = "0.1.44"

# harness-daemon-state, harness-task-board, and serde_json back only the
# macOS Keychain-reading branch (see src/lib.rs's cfg gates); a non-macOS
# build never references them.
[target.'cfg(target_os = "macos")'.dependencies]
harness-daemon-state = { path = "../harness-daemon-state", version = "55.0.1" }
harness-task-board = { path = "../harness-task-board", version = "55.0.1" }
security-framework = "3"
serde_json = "1.0.149"

[features]
# Keeps harness-daemon's own tests (which reach this crate's public
# `load_provider_credentials` through `serve::serve`) off the real Keychain
# read the same way `cfg(test)` already does for this crate's own unit
# tests; see src/lib.rs's module doc. Matches harness-daemon-state's own
# test-support feature.
test-support = []

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
unexpected_cfgs = { level = "deny", priority = 2, check-cfg = ['cfg(feature, values("test-support"))'] }
