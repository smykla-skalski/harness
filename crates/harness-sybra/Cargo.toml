[package]
name = "harness-sybra"
version = "55.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "harness-sybra"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.7", features = ["http2", "json"] }
bytes = "1.10.1"
clap = { version = "4.6.0", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1.11.0", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["client", "client-legacy", "http1", "http2", "tokio"] }
libc = "0.2"
serde_json = "1.0.149"
serde_urlencoded = "0.7.1"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio-stream = "0.1"
tower = { version = "=0.5.3", features = ["util"] }

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
