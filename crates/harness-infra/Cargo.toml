[package]
name = "harness-infra"
version = "55.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-kernel = { path = "../harness-kernel", version = "55.0.0" }
chrono = { version = "0.4.44", features = ["serde"] }
fs2 = "0.4.3"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
temp-env = { version = "=0.3.6", features = ["async_closure"] }

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel and harness-workspace do: a
# crate extracted from src/ keeps the rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
