[package]
name = "harness-task-board-provider-sync"
version = "55.0.2"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
# Exposes `open_task_board_sync_conflicts` outside `cfg(test)`, matching
# `harness-task-board`'s own `daemon-runtime` feature: `tests/integration_daemon.rs`
# links `harness` as an ordinary dependency, where `cfg(test)` is never set.
daemon-runtime = []

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
harness-kernel = { path = "../harness-kernel", version = "55.0.2" }
harness-protocol = { path = "../harness-protocol", version = "55.0.2" }
harness-task-board = { path = "../harness-task-board", version = "55.0.2" }
harness-workspace = { path = "../harness-workspace", version = "55.0.2" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["sqlite", "runtime-tokio", "tls-rustls-ring", "macros", "chrono", "uuid", "json"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
