[package]
name = "harness-daemon-db-queries"
version = "57.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-daemon-db-core = { path = "../harness-daemon-db-core", version = "57.0.0" }
harness-daemon-launchd = { path = "../harness-daemon-launchd", version = "57.0.0" }
harness-daemon-root = { path = "../harness-daemon-root", version = "57.0.0" }
harness-daemon-session-service = { path = "../harness-daemon-session-service", version = "57.0.0" }
harness-daemon-snapshot = { path = "../harness-daemon-snapshot", version = "57.0.0" }
harness-kernel = { path = "../harness-kernel", version = "57.0.0" }
harness-protocol = { path = "../harness-protocol", version = "57.0.0" }
harness-session = { path = "../harness-session", version = "57.0.0" }
harness-task-board = { path = "../harness-task-board", version = "57.0.0" }
harness-telemetry = { path = "../harness-telemetry", version = "57.0.0" }
harness-timeline = { path = "../harness-timeline", version = "57.0.0" }
harness-workspace = { path = "../harness-workspace", version = "57.0.0" }
chrono = { version = "0.4.44", features = ["serde"] }
hex = "0.4.3"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.9.0-alpha.1", default-features = false, features = ["sqlite", "sqlite-bundled", "runtime-tokio", "tls-rustls-ring", "migrate", "macros", "chrono", "uuid", "json"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread"] }
tracing = "0.1.44"

[dev-dependencies]
# Superset of the `[dependencies]` entry above: adds the `test-support`
# feature this crate's own `#[cfg(test)]` code needs for
# `DaemonDb::open_in_memory_with_hooks`, matching harness-daemon's own
# dev-dependency override of the same crate.
harness-daemon-db-core = { path = "../harness-daemon-db-core", version = "57.0.0", features = ["test-support"] }

# Matches harness-daemon-db-core's lint set: this code was extracted from
# harness-daemon's own `db` module, which itself carries only the lighter
# facade-crate lint set, so it keeps the bar it was already written and
# reviewed against instead of a stricter one applied after the fact.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
