[package]
name = "harness-voice"
version = "55.0.1"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
base64 = "0.23.0"
chrono = { version = "0.4.44", features = ["serde"] }
fs-err = "3.3.0"
harness-kernel = { path = "../harness-kernel", version = "55.0.1" }
harness-protocol = { path = "../harness-protocol", version = "55.0.1" }
harness-workspace = { path = "../harness-workspace", version = "55.0.1" }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["rt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
harness-testkit = { path = "../../testkit" }
temp-env = { version = "=0.3.6", features = ["async_closure"] }
tempfile = "=3.27.0"
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "test-util"] }

# Matches the root crate's lint set rather than the lighter one the facade
# crates carry, for the same reason harness-kernel, harness-workspace,
# harness-infra, and harness-agents do: a crate extracted from src/ keeps
# the rules its sources were written under.
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }
