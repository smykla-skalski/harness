[package]
name = "harness-daemon-discovery"
version = "56.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-daemon-client = { path = "../harness-daemon-client", version = "56.0.0" }
harness-daemon-root = { path = "../harness-daemon-root", version = "56.0.0" }
harness-workspace = { path = "../harness-workspace", version = "56.0.0" }

[dev-dependencies]
fs2 = "=0.4.3"
temp-env = { version = "=0.3.6", features = ["async_closure"] }
tempfile = "=3.27.0"

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
