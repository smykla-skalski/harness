[package]
name = "harness-task-board-git-runtime"
version = "55.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
harness-daemon-state = { path = "../harness-daemon-state", version = "55.0.0" }
harness-kernel = { path = "../harness-kernel", version = "55.0.0" }
harness-task-board = { path = "../harness-task-board", version = "55.0.0" }

[dev-dependencies]
harness-daemon-state = { path = "../harness-daemon-state", version = "55.0.0", features = ["test-support"] }

[features]
daemon-runtime = ["harness-daemon-state/daemon-runtime"]
test-support = ["harness-daemon-state/test-support"]

[lints.clippy]
pedantic = { level = "deny", priority = 1 }

[lints.rust]
unused = { level = "deny", priority = 1 }
unexpected_cfgs = { level = "deny", priority = 2, check-cfg = ['cfg(feature, values("daemon-runtime", "test-support"))'] }
