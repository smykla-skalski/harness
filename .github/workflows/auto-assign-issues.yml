---
name: Auto-assign issues

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  assign:
    name: Assign new issue
    permissions:
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Assign issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-assignee bartsmykla
