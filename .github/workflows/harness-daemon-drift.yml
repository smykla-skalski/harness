# Harness Daemon Drift workflow
#
# `harness-daemon` re-includes root source modules via #[path] instead of
# depending on the root `harness` package, but it declares its Cargo
# dependencies and features separately in its own Cargo.toml. A root change
# that adds a dependency or enables a feature used by that shared source
# leaves harness-daemon's manifest behind, and nothing catches it until
# someone builds harness-daemon specifically (see #551, #559, #581). This
# workflow runs that build on every PR that could cause it.

name: Harness Daemon Drift

on:
  # No `paths:` filter here: this check is required by branch protection, and
  # GitHub never reports a status for a workflow a PR's paths didn't trigger,
  # which leaves a PR that touches none of these paths permanently blocked
  # ("Expected — waiting for status to be reported"). The job below decides
  # path relevance itself and skips the real work when nothing Rust-relevant
  # changed, so the required check still gets reported on every PR.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/harness-daemon-drift.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "src/**"
      - "crates/harness-daemon/**"
      - "crates/harness-workspace/**"
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter needs this to list a pull request's changed files
  # through the GitHub API; it only reads it for pull_request events.
  pull-requests: read

jobs:
  daemon-drift:
    name: harness-daemon dependency drift
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}

    steps:
      # Runs only for pull_request: it uses the GitHub API for that event and
      # needs no checkout, but git-diff mode for push/workflow_dispatch would
      # fail with no repository checked out yet. push already carries its own
      # `paths:` filter above and workflow_dispatch is an explicit manual
      # request, so both always run the real check regardless of this output.
      - name: Determine if Rust-relevant paths changed
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            rust:
              - ".github/workflows/harness-daemon-drift.yml"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/**"
              - "src/**"
              - "crates/harness-daemon/**"
              - "crates/harness-workspace/**"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `.cargo/config.toml` pins the Linux linker to mold unconditionally, so
      # every rustc invocation here needs it on PATH before cargo runs.
      - name: Install mold linker
        if: github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true'
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Cache Cargo registry and harness-daemon build lane
        if: github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/dev
          key: harness-daemon-drift-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/**') }}
          restore-keys: |
            harness-daemon-drift-${{ runner.os }}-

      - name: Check harness-daemon against its own Cargo.toml
        if: github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true'
        run: ./scripts/cargo-local.sh clippy --all-targets -p harness-daemon -- -D warnings
