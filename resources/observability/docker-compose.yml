name: harness-observability

services:
  alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3
    command:
      - -config.file=/etc/tempo/tempo.yml
    user: "0"
    restart: unless-stopped
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/lib/tempo
    ports:
      - "127.0.0.1:3200:3200"

  loki:
    image: grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    command:
      - -config.file=/etc/loki/loki.yml
    user: "0"
    restart: unless-stopped
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/var/lib/loki
    ports:
      - "127.0.0.1:3100:3100"

  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=otlp-deltatocumulative,exemplar-storage,native-histograms
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sqlite-snapshot:
    image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
    command:
      - python3
      - /app/sync.py
      - --interval
      - "2"
    restart: unless-stopped
    volumes:
      - ./sqlite-snapshot/sync.py:/app/sync.py:ro
      - "${HARNESS_SQLITE_SOURCE_DAEMON_DIR}:/srv/source/daemon:ro"
      - "${HARNESS_SQLITE_SOURCE_MONITOR_DIR}:/srv/source/monitor:ro"
      - "${HARNESS_SQLITE_SNAPSHOT_DAEMON_DIR}:/srv/sqlite/daemon:rw"
      - "${HARNESS_SQLITE_SNAPSHOT_MONITOR_DIR}:/srv/sqlite/monitor:rw"

  sqlite-exporter:
    image: harness/sqlite-exporter:5.0.2-curl
    build:
      context: .
      dockerfile: ./query-exporter/Dockerfile
    command:
      - -p
      - "9560"
      - --process-stats
    restart: unless-stopped
    volumes:
      - ./query-exporter/config.yml:/config/config.yaml:ro
      - "${HARNESS_SQLITE_SNAPSHOT_DAEMON_DIR}:/srv/sqlite/daemon:ro"
      - "${HARNESS_SQLITE_SNAPSHOT_MONITOR_DIR}:/srv/sqlite/monitor:ro"
    ports:
      - "127.0.0.1:9560:9560"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9560/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - sqlite-snapshot

  copilot-token-exporter:
    image: python:3.14-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
    command:
      - python3
      - /app/exporter.py
      - --tempo-url
      - http://tempo:3200
      - --listen-host
      - 0.0.0.0
      - --listen-port
      - "9561"
    restart: unless-stopped
    volumes:
      - ./copilot-token-exporter/exporter.py:/app/exporter.py:ro
      - copilot-token-exporter-data:/var/lib/copilot-token-exporter
    ports:
      - "127.0.0.1:9561:9561"
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://localhost:9561/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - tempo

  pyroscope:
    image: grafana/pyroscope:2.2.0@sha256:7f019d866e474609c7f112d2632d75bdf8ad418c08461fcb5193444bb6dc476d
    command:
      - -config.file=/etc/pyroscope/config.yaml
    restart: unless-stopped
    volumes:
      - ./pyroscope/config.yaml:/etc/pyroscope/config.yaml:ro
      - pyroscope-v2-data:/data
      - pyroscope-v2-compactor-data:/data-compactor
      - pyroscope-v2-metastore-data:/data-metastore
    ports:
      - "127.0.0.1:4040:4040"

  grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    user: "0"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-harness}
      GF_USERS_DEFAULT_THEME: ${GF_USERS_DEFAULT_THEME:-light}
      GF_ALERTING_EMAIL_ADDRESSES: ${GF_ALERTING_EMAIL_ADDRESSES:-admin@localhost}
      GF_PLUGINS_PREINSTALL_SYNC: grafana-llm-app@1.0.8@https://grafana.com/api/plugins/grafana-llm-app/versions/1.0.8/download,frser-sqlite-datasource@4.0.2,bsull-console-datasource
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - "${HARNESS_SQLITE_SNAPSHOT_DAEMON_DIR}:/srv/sqlite/daemon:ro"
      - "${HARNESS_SQLITE_SNAPSHOT_MONITOR_DIR}:/srv/sqlite/monitor:ro"
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - tempo
      - loki
      - prometheus
      - sqlite-snapshot
      - sqlite-exporter
      - pyroscope

  grafana-init:
    image: alpine/curl:8.21.0@sha256:fd7f01bc6c6caec45a8fd5b871f0f51bf3c7cee0b185830ff25b8110f7e6e77d
    restart: "no"
    environment:
      GRAFANA_URL: http://grafana:3000
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-harness}
    volumes:
      - ./grafana/init-star-dashboards.sh:/init-star-dashboards.sh:ro
    entrypoint: ["/bin/sh", "/init-star-dashboards.sh"]
    depends_on:
      grafana:
        condition: service_healthy

volumes:
  alloy-data:
    name: harness-observability_alloy-data
  tempo-data:
    name: harness-observability_tempo-data
  loki-data:
    name: harness-observability_loki-data
  prometheus-data:
    name: harness-observability_prometheus-data
  copilot-token-exporter-data:
    name: harness-observability_copilot-token-exporter-data
  pyroscope-v2-data:
    name: harness-observability_pyroscope-v2-data
  pyroscope-v2-compactor-data:
    name: harness-observability_pyroscope-v2-compactor-data
  pyroscope-v2-metastore-data:
    name: harness-observability_pyroscope-v2-metastore-data
  grafana-data:
    name: harness-observability_grafana-data
